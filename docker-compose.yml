
services:
  db:
    image: postgres:16
    container_name: pulseiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pulseiq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: pulseiq-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    command: streamlit run dashboards/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  pulseiq_data:
